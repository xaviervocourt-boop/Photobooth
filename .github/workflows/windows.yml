name: Application Windows

# Construit l'installeur Windows (Photobooth-Setup-x.y.z.exe) à chaque mise à jour
# de main. Une étiquette v* (ex. v1.2.0) publie en plus une « Release » à télécharger.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installeur:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Construire l'installeur
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Mettre l'installeur à disposition
        uses: actions/upload-artifact@v7
        with:
          path: dist/Photobooth-Setup-*.exe
          archive: false
          if-no-files-found: error

      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Photobooth-Setup-*.exe
